name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Lints custom_components/nikobus per ruff defaults. The version is
      # pinned: ruff-action installs the latest release when it finds no
      # pyproject.toml (the config is in ruff.toml), so a new release
      # could fail a PR that changes no code. Bump it on purpose.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.3"
          args: "check --output-format=github"

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Home Assistant itself is stubbed in tests/conftest.py, but the
      # integration modules still import the real library + helpers at load
      # time, so install the manifest's runtime requirements alongside pytest
      # (read from the manifest, so the tests run against the library
      # version the integration requires). voluptuous is installed so the
      # form and service schemas are really validated; async tests use
      # @pytest.mark.asyncio, so pytest-asyncio is required.
      - run: pip install pytest pytest-asyncio aiofiles voluptuous pyyaml
      - name: Install the manifest requirements
        run: |
          python - <<'PY' > "$RUNNER_TEMP/manifest-requirements.txt"
          import json
          with open("custom_components/nikobus/manifest.json") as fh:
              print("\n".join(json.load(fh)["requirements"]))
          PY
          pip install -r "$RUNNER_TEMP/manifest-requirements.txt"
      - run: python -m pytest -q

  test-minimum-library:
    # HACS leaves the manifest's lower bound installed until the pin
    # rises: the tests must pass against exactly that nikobus-connect.
    name: Tests (minimum nikobus-connect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-asyncio aiofiles voluptuous pyyaml
      - name: Install the manifest requirements at their minimum versions
        run: |
          python - <<'PY' > "$RUNNER_TEMP/manifest-minimum.txt"
          import json
          for req in json.load(open("custom_components/nikobus/manifest.json"))["requirements"]:
              print(req.replace(">=", "==", 1))
          PY
          pip install -r "$RUNNER_TEMP/manifest-minimum.txt"
      - run: python -m pytest -q

  hassfest:
    name: Hassfest (manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          # brands: not (yet) in home-assistant/brands; skip that check so
          # a valid custom integration isn't failed for it.
          # license: the repo ships the PolyForm Noncommercial 1.0.0
          # LICENSE, but GitHub's license detection only knows the
          # choosealicense.com set (all of which permit commercial use)
          # — a noncommercial license can never be "identified", so the
          # check would stay red forever by design, not by accident.
          ignore: brands license
